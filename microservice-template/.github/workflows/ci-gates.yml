name: SDGE Microservice CI Gates

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main]

jobs:
  sdge-gates:
    # Replace YOUR-GITHUB-ORG with your GitHub organization name
    uses: YOUR-GITHUB-ORG/Plant-A-Virtual-CTO/.github/workflows/reusable-sdge-gates.yml@main
    with:
      # Set to: node | python | angular | mobile | contracts
      stack: "node"
      max_pr_lines: 400
      fast_track_max_lines: 100


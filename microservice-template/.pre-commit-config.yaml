# =============================================================================
# Local Laptop Pre-Commit Guardrails (.pre-commit-config.yaml)
# Catches hardcoded secrets (gitleaks), merge conflicts, and syntax/lint errors
# in 3 seconds on the developer's machine BEFORE 'git push'.
# Install once per repo: pre-commit install
# =============================================================================
repos:
  # 1. Prevent Hardcoded Secrets & Keys From Ever Entering Git History (ISO 27001 A.8.28)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # 2. Universal Git Hygiene (Merge conflicts, large files, invalid JSON/YAML)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  # 3. Fast Python Linting & Formatting on Staged Files Only (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

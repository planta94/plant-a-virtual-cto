name: Auto-Broadcast Standards to All Microservice Repos

on:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "ai-context/**"
      - "microservice-template/**"
      - ".github/workflows/reusable-sdge-gates.yml"
  workflow_dispatch:

jobs:
  broadcast-standards:
    name: "Sync AGENTS.md & CI Gates to All Repos"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # List all your microservice, frontend, and mobile repositories here:
        target:
          - { repo: "service-a", stack: "node" }
          - { repo: "service-b", stack: "python" }
          - { repo: "web-angular", stack: "angular" }
          - { repo: "mobile-app", stack: "mobile" }
    steps:
      - name: Checkout Central Engineering Standards Hub
        uses: actions/checkout@v4
        with:
          path: Plant-A-Virtual-CTO

      - name: Checkout Target Repository (${{ matrix.target.repo }})
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.target.repo }}
          token: ${{ secrets.CROSS_REPO_SYNC_PAT }}
          path: target-repo

      - name: Run Sync Script & Open/Push Sync Commit
        run: |
          chmod +x ./Plant-A-Virtual-CTO/scripts/sync-microservice.sh
          ./Plant-A-Virtual-CTO/scripts/sync-microservice.sh ./target-repo "${{ matrix.target.stack }}"
          cd target-repo
          git config user.name "sdge-standards-bot"
          git config user.email "standards-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git checkout -B chore/sync-Plant-A-Virtual-CTO
            git add AGENTS.md CLAUDE.md .cursorrules .github/ .gemini/
            git commit -m "chore(standards): auto-sync AGENTS.md and CI gates from Plant-A-Virtual-CTO [FAST-TRACK]"
            git push origin chore/sync-Plant-A-Virtual-CTO --force
          else
            echo "Target repo is already in sync."
          fi


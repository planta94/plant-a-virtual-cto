name: "Stage 2 Gate: OpenAPI & Event Contract Breaking-Change Blocker"

on:
  pull_request:
    paths:
      - 'contracts/openapi/**'
      - 'contracts/events/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  contract_safety_gate:
    name: "Block Backward-Incompatible API & Event Schema Changes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for [CTO-OVERRIDE] Token
        id: override_check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          TEXT="$PR_TITLE $PR_BODY"
          if echo "$TEXT" | grep -qiE '\[CTO-OVERRIDE:\s*[^\]]+\]'; then
            REASON=$(echo "$TEXT" | grep -oiE '\[CTO-OVERRIDE:\s*[^\]]+\]' | head -n 1)
            echo "⚠️ [SOC2/ISO27001 AUDIT LOG] Breaking Contract Change Override invoked on PR #$PR_NUM by @$PR_AUTHOR: $REASON"
            echo "override=true" >> $GITHUB_OUTPUT
          else
            echo "override=false" >> $GITHUB_OUTPUT
          fi

      - name: Run oasdiff OpenAPI Breaking-Change Detection (Pinned Release v1.11.7)
        id: openapi_diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HAS_OVERRIDE: ${{ steps.override_check.outputs.override }}
          OASDIFF_VERSION: "1.11.7"
        run: |
          echo "Installing pinned oasdiff v${OASDIFF_VERSION} (Supply-Chain Safe)..."
          mkdir -p ./bin
          curl -fsSL "https://github.com/Tufin/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" -o /tmp/oasdiff.tar.gz
          tar -xzf /tmp/oasdiff.tar.gz -C ./bin oasdiff
          chmod +x ./bin/oasdiff

          CHANGED_SPECS=$(git diff --name-only origin/$BASE_REF...HEAD -- 'contracts/openapi/*.yaml' 'contracts/openapi/*.yml' || true)
          BREAKING_FOUND=0

          for spec in $CHANGED_SPECS; do
            if git cat-file -e origin/$BASE_REF:"$spec" 2>/dev/null; then
              echo "🔍 Checking OpenAPI backward compatibility for $spec against origin/$BASE_REF..."
              git show origin/$BASE_REF:"$spec" > /tmp/base_spec.yaml
              if ! ./bin/oasdiff breaking /tmp/base_spec.yaml "$spec" --fail-on ERR; then
                echo "❌ BREAKING OPENAPI CHANGE DETECTED in $spec!"
                BREAKING_FOUND=1
              else
                echo "✅ $spec is backward-compatible."
              fi
            else
              echo "🆕 New OpenAPI specification added: $spec (validating syntax...)"
            fi
          done

          if [ "$BREAKING_FOUND" -eq 1 ]; then
            if [ "$HAS_OVERRIDE" = "true" ]; then
              echo "⚠️ Breaking OpenAPI change permitted via [CTO-OVERRIDE]."
            else
              echo "❌ Gate Failed: Breaking OpenAPI changes (deleting endpoints, renaming fields, or adding required params) break live Mobile/Angular clients."
              echo "👉 Fix: Make the change additive (optional field) or create a new versioned endpoint (/v2/...), or obtain a [CTO-OVERRIDE: <reason>]."
              exit 1
            fi
          fi

      - name: Verify JSON Event Schema Backward Compatibility
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HAS_OVERRIDE: ${{ steps.override_check.outputs.override }}
        run: |
          CHANGED_EVENTS=$(git diff --name-only origin/$BASE_REF...HEAD -- 'contracts/events/*.json' || true)
          BREAKING_EVENT=0

          for schema in $CHANGED_EVENTS; do
            # Validate JSON syntax first
            jq empty "$schema" || { echo "❌ Invalid JSON in $schema"; exit 1; }

            if git cat-file -e origin/$BASE_REF:"$schema" 2>/dev/null; then
              echo "🔍 Checking JSON Schema backward compatibility for $schema..."
              git show origin/$BASE_REF:"$schema" > /tmp/base_event.json

              # Check if any previously defined property was removed
              OLD_PROPS=$(jq -r '.properties // {} | keys[]' /tmp/base_event.json | sort)
              NEW_PROPS=$(jq -r '.properties // {} | keys[]' "$schema" | sort)
              REMOVED_PROPS=$(comm -23 <(echo "$OLD_PROPS") <(echo "$NEW_PROPS"))

              if [ -n "$REMOVED_PROPS" ]; then
                echo "❌ BREAKING EVENT SCHEMA CHANGE in $schema: Removed properties: $REMOVED_PROPS"
                BREAKING_EVENT=1
              fi

              # Check if new required fields were added without bumping version
              OLD_REQ=$(jq -r '.required // [] | .[]' /tmp/base_event.json | sort)
              NEW_REQ=$(jq -r '.required // [] | .[]' "$schema" | sort)
              ADDED_REQ=$(comm -13 <(echo "$OLD_REQ") <(echo "$NEW_REQ"))

              if [ -n "$ADDED_REQ" ]; then
                echo "❌ BREAKING EVENT SCHEMA CHANGE in $schema: Added new required fields to existing event version: $ADDED_REQ"
                BREAKING_EVENT=1
              fi
            fi
          done

          if [ "$BREAKING_EVENT" -eq 1 ] && [ "$HAS_OVERRIDE" != "true" ]; then
            echo "❌ Gate Failed: Event schema changes must be additive (do not remove fields or add required fields to an existing event version)."
            exit 1
          fi
          echo "✅ All Event Schemas are valid and backward-compatible."
